name: Firestore Rules Test Suite

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test-rules:
    name: Test Firestore Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore Rules Tests via Emulator
        run: |
          set -o pipefail
          set +e
          npx firebase-tools@15.29.0 emulators:exec --only firestore \
            --project demo-avora-security-ci \
            "npm run test:rules" 2>&1 | tee emulator.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if grep -i -E -q "maximum of 1000 expressions|1000 expressions to evaluate" emulator.log; then
            echo "::error::Expression-limit failure detected in emulator logs!"
            grep -i -E -n "maximum of 1000 expressions|1000 expressions to evaluate" emulator.log
            exit 1
          fi
          exit $TEST_EXIT_CODE
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8085"
